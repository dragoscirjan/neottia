freebsd_node_task:
  name: FreeBSD 14.3 x64 / UFS2 / Node.js
  freebsd_instance:
    image_family: freebsd-14-3
  env:
    MAKE: gmake
    PYTHON: /usr/local/bin/python3.11
  setup_script:
    - pkg install -y git gmake node22 npm-node22 python311
    - corepack enable
    - corepack prepare pnpm@10.28.2 --activate
  install_script:
    - pnpm install --frozen-lockfile
  native_smoke_script:
    - cd packages/repository-store
    - pnpm run build:native
    - node test/freebsd-native-smoke.mjs
  node_acceptance_script:
    - pnpm --filter @neottia/repository-store test:node
