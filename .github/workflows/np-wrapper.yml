name: NP wrapper

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make a fake site
        run: |
          mkdir -p docs-site
          echo '<html>probe</html>' > docs-site/index.html
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site

  publish:
    needs: build
    uses: dragoscirjan/dragoscirjan.github.io/.github/workflows/docs.yml@main
    with:
      project: call-test-probe
    secrets:
      token: ${{ secrets.GH_TOKEN }}
