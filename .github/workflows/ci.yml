name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Validate
    uses: ./.github/workflows/ci.quality.yml
    with:
      runs-on: ubuntu-latest

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run deps:sync:pnpm
      - run: mise run test

  release:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # The release workflow dispatches validation for token-created version PRs.
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.release.yml
    secrets: inherit

  # Every successful release republishes the documentation site.
  docs-publish:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs.publish.yml
    secrets: inherit
