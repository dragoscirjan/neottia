name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      native-prebuilds:
        description: Build and attest every certified native prebuild without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Validate
    uses: ./.github/workflows/ci.quality.yml
    with:
      runs-on: ubuntu-latest

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.tier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            tier: required
            experimental: false
          - os: ubuntu-24.04-arm
            architecture: arm64
            tier: required
            experimental: false
          - os: macos-26
            architecture: arm64
            tier: required
            experimental: false
          - os: macos-15
            architecture: arm64
            tier: required
            experimental: false
          - os: macos-26-intel
            architecture: x64
            tier: required
            experimental: false
          - os: macos-15-intel
            architecture: x64
            tier: required
            experimental: false
          - os: windows-2025
            architecture: x64
            tier: required
            experimental: false
          - os: windows-2022
            architecture: x64
            tier: required
            experimental: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run deps:sync:pnpm
      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE) throw new Error('Expected ' + process.env.EXPECTED_ARCHITECTURE + ', got ' + process.arch)"
      - name: Verify Windows native backend
        if: runner.os == 'Windows'
        working-directory: packages/repository-store
        run: pnpm run build:native && node test/windows-native-smoke.mjs
      - name: Run tests
        id: tests
        continue-on-error: ${{ matrix.experimental }}
        run: mise run test
      - name: Verify clean packed external source journey
        if: steps.tests.outcome == 'success'
        run: node packages/cli/test/packed-external-journey.mjs --mode source
      - name: Report experimental failure
        if: ${{ always() && matrix.experimental && steps.tests.outcome == 'failure' }}
        run: echo "::warning::${{ matrix.os }} remains experimental because its test suite failed."

  release-state:
    name: Detect native release
    needs: [quality, test]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.native-prebuilds)
    runs-on: ubuntu-latest
    outputs:
      repository-store-native-required: ${{ steps.native.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install: true
          cache: true
      - name: Detect unpublished or incomplete native release
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Tempel versions packages before it can publish them. Do not build assets for
          # the old package version while any Changeset is waiting to be applied.
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "required=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current="$(node -p "require('./packages/repository-store/package.json').version")"
          lookup_error="$(mktemp)"
          trap 'rm -f "${lookup_error}"' EXIT
          if published="$(pnpm view @neottia/repository-store version 2>"${lookup_error}")"; then
            if [[ -z "${published}" ]]; then
              echo "::error::The npm registry returned no published Repository Store version."
              exit 1
            fi
          elif grep -Eqi 'ERR_PNPM_FETCH_404|E404|404 Not Found|is not in .*registry' "${lookup_error}"; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            echo "::error::Could not determine the published Repository Store version. Refusing to build native release assets."
            exit 1
          fi
          if [[ "${current}" != "${published}" ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag="@neottia/repository-store@${current}"
          assets="$(gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          incomplete=false
          for tuple in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 freebsd-x64; do
            name="repository-store-native-v${current}-${tuple}.node"
            for expected in "${name}" "${name}.sigstore.json" "${name}.intoto.jsonl"; do
              if ! grep -Fxq "${expected}" <<< "${assets}"; then incomplete=true; fi
            done
          done
          if ! grep -Fxq "native-prebuilds.json" <<< "${assets}"; then incomplete=true; fi
          if [[ "${incomplete}" == 'true' ]]; then
            echo "::error::The published ${tag} native release is incomplete. Refusing to rebuild published-version assets from ${GITHUB_SHA}."
            exit 1
          fi
          echo "required=false" >> "${GITHUB_OUTPUT}"

  native-prebuilds:
    name: Native prebuild (${{ matrix.platform }}, ${{ matrix.architecture }})
    needs: release-state
    if: needs.release-state.outputs.repository-store-native-required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - os: macos-15-intel
            platform: darwin
            architecture: x64
          - os: macos-15
            platform: darwin
            architecture: arm64
          - os: windows-2025
            platform: win32
            architecture: x64
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install: true
          cache: true
      - run: mise run deps:sync:pnpm
      - name: Verify runner tuple
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE || process.platform !== process.env.EXPECTED_PLATFORM) throw new Error('Unexpected runner tuple ' + process.platform + '-' + process.arch)"
      - name: Build native addon
        working-directory: packages/repository-store
        run: pnpm run build:native
      - name: Package and sign native prebuild
        id: package
        working-directory: packages/repository-store
        run: node scripts/package-native-prebuild.mjs --output native-prebuilds
      - name: Smoke-test packaged addon
        working-directory: packages/repository-store
        run: node test/native-prebuild-smoke.mjs native-prebuilds/${{ steps.package.outputs.asset-name }} ${{ matrix.platform }}
      - name: Verify clean packed external prebuilt journey
        run: node packages/cli/test/packed-external-journey.mjs --mode prebuilt --artifacts packages/repository-store/native-prebuilds
      - name: Verify clean packed install and source fallback
        # Release manifests pin the protected main-workflow identity. Branch
        # validation verifies its actual branch identity in the packaging step.
        if: matrix.platform == 'linux' && matrix.architecture == 'x64' && github.ref == 'refs/heads/main'
        working-directory: packages/repository-store
        run: node test/packed-prebuild-install.mjs native-prebuilds
      - name: Attest native prebuild
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: packages/repository-store/native-prebuilds/${{ steps.package.outputs.asset-name }}
      - name: Preserve attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          DESTINATION: packages/repository-store/native-prebuilds/${{ steps.package.outputs.asset-name }}.intoto.jsonl
        run: node -e "require('node:fs').copyFileSync(process.env.BUNDLE_PATH, process.env.DESTINATION)"
      - name: Upload native prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repository-store-native-${{ matrix.platform }}-${{ matrix.architecture }}
          path: packages/repository-store/native-prebuilds/*
          if-no-files-found: error

  native-prebuild-freebsd:
    name: Native prebuild (freebsd, x64)
    needs: release-state
    if: needs.release-state.outputs.repository-store-native-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, sign, and smoke-test on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.3'
          copyback: true
          envs: 'ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_SHA'
          mem: 4096
          prepare: |
            pkg install -y git gmake node22 npm-node22 python311
            npm install --global pnpm@10.28.2
          run: |
            set -eu
            export MAKE=gmake
            export PYTHON=/usr/local/bin/python3.11
            pnpm install --frozen-lockfile
            pnpm --filter @neottia/repository-store build:native
            node packages/repository-store/test/freebsd-native-smoke.mjs
            node packages/repository-store/scripts/package-native-prebuild.mjs --output packages/repository-store/native-prebuilds
            artifact="$(find packages/repository-store/native-prebuilds -name '*.node' -type f)"
            node packages/repository-store/test/native-prebuild-smoke.mjs "${artifact}" freebsd
            node packages/cli/test/packed-external-journey.mjs --mode prebuilt --artifacts packages/repository-store/native-prebuilds
      - name: Locate FreeBSD prebuild
        id: package
        shell: bash
        run: |
          asset="$(find packages/repository-store/native-prebuilds -name '*.node' -type f -printf '%f')"
          test -n "${asset}"
          echo "asset-name=${asset}" >> "${GITHUB_OUTPUT}"
      - name: Attest FreeBSD prebuild
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: packages/repository-store/native-prebuilds/${{ steps.package.outputs.asset-name }}
      - name: Preserve attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          DESTINATION: packages/repository-store/native-prebuilds/${{ steps.package.outputs.asset-name }}.intoto.jsonl
        run: node -e "require('node:fs').copyFileSync(process.env.BUNDLE_PATH, process.env.DESTINATION)"
      - name: Upload FreeBSD prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repository-store-native-freebsd-x64
          path: packages/repository-store/native-prebuilds/*
          if-no-files-found: error

  release:
    needs: [quality, test, release-state, native-prebuilds, native-prebuild-freebsd]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      needs.test.result == 'success' &&
      needs.release-state.result == 'success' &&
      (needs.native-prebuilds.result == 'success' || needs.native-prebuilds.result == 'skipped') &&
      (needs.native-prebuild-freebsd.result == 'success' || needs.native-prebuild-freebsd.result == 'skipped')
    permissions:
      # The release workflow dispatches validation for token-created version PRs.
      actions: write
      attestations: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.release.yml
    with:
      native-prebuilds: ${{ needs.release-state.outputs.repository-store-native-required == 'true' }}
    secrets: inherit

  # Every successful release republishes the documentation site.
  docs-publish:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs.publish.yml
    secrets: inherit
