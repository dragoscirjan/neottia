name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Validate
    uses: ./.github/workflows/ci.quality.yml
    with:
      runs-on: ubuntu-latest

  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # The release workflow dispatches validation for token-created version PRs.
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.release.yml
    secrets: inherit

  # Every successful release republishes the documentation site.
  docs-publish:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs.publish.yml
    secrets: inherit
