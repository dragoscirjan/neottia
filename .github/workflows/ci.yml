name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Validate
    uses: ./.github/workflows/ci.quality.yml
    with:
      runs-on: ubuntu-latest

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.tier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            tier: required
            experimental: false
          - os: macos-latest
            architecture: arm64
            tier: required
            experimental: false
          - os: macos-15
            architecture: arm64
            tier: required
            experimental: false
          - os: macos-26-intel
            architecture: x64
            tier: required
            experimental: false
          - os: macos-15-intel
            architecture: x64
            tier: required
            experimental: false
          - os: windows-2025
            architecture: x64
            tier: experimental
            experimental: true
          - os: windows-2022
            architecture: x64
            tier: experimental
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run deps:sync:pnpm
      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE) throw new Error('Expected ' + process.env.EXPECTED_ARCHITECTURE + ', got ' + process.arch)"
      - name: Run tests
        id: tests
        continue-on-error: ${{ matrix.experimental }}
        run: mise run test
      - name: Report experimental failure
        if: ${{ always() && matrix.experimental && steps.tests.outcome == 'failure' }}
        run: echo "::warning::${{ matrix.os }} remains experimental because its test suite failed."

  release:
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # The release workflow dispatches validation for token-created version PRs.
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.release.yml
    secrets: inherit

  # Every successful release republishes the documentation site.
  docs-publish:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs.publish.yml
    secrets: inherit
