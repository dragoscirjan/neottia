name: CI » Release

on:
  workflow_call:
    inputs:
      native-prebuilds:
        description: Assemble and publish Repository Store native prebuilds.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run deps:sync:pnpm
      - name: Download native prebuilds
        if: inputs.native-prebuilds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: repository-store-native-*
          path: native-prebuilds
          merge-multiple: true
      - name: Verify GitHub native provenance
        if: inputs.native-prebuilds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for artifact in native-prebuilds/*.node; do
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Verify native signatures and assemble manifest
        if: inputs.native-prebuilds
        run: node packages/repository-store/scripts/assemble-native-prebuilds.mjs --input native-prebuilds
      - name: Configure npm registry authentication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Quality has already validated this commit; the release configuration
      # only rebuilds package artifacts before Changesets publishes them.
      - name: Create release pull request or publish packages
        id: release
        uses: dragoscirjan/tempel-javascript/.github/actions/release@e88bf519e8fe731fcb9440e987475fe109076d0a
        with:
          config: .github/tempel-release.yml
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish verified native release assets
        if: inputs.native-prebuilds && steps.release.outputs.mode != 'version'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/repository-store/scripts/publish-native-prebuilds.mjs --input native-prebuilds
      # A global release is prepared explicitly and remains outside Changesets.
      - name: Publish the prepared global release
        if: steps.release.outputs.mode != 'version'
        run: mise run release:global:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # GITHUB_TOKEN-created pull requests do not trigger pull_request workflows.
      - name: Validate the version pull request
        if: steps.release.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr-number }}
        run: |
          head_ref="$(gh pr view "${PR_NUMBER}" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "${head_ref}"
